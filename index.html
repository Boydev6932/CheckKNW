<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสถานะนักศึกษาวิชาทหาร แก่นนครวิทยาลัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c8a84b;
    --gold-light: #f0d070;
    --gold-dark: #8a6a1a;
    --green-dark: #1a2a12;
    --green-mid: #2d4a1a;
    --green-army: #4a6741;
    --green-light: #6b8f4e;
    --cream: #f5ead0;
    --red-army: #8b1a1a;
    --black: #0a0c08;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    background: #0a0c08;
  }

  /* ── BACKGROUND ── */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
  }
  .bg-img {
    width:100%; height:100%; object-fit:cover;
    filter: brightness(0.45) saturate(0.7);
  }
  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(10,15,8,0.65) 0%,
      rgba(20,35,12,0.45) 40%,
      rgba(10,15,8,0.75) 100%
    );
  }
  /* camo pattern overlay */
  .bg-camo {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse 120px 80px at 15% 20%, rgba(40,60,20,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 90px 110px at 80% 15%, rgba(20,40,10,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 150px 60px at 60% 75%, rgba(30,50,15,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 80px 90px at 25% 80%, rgba(50,70,25,0.14) 0%, transparent 70%);
  }

  /* ── SCANLINE EFFECT ── */
  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
  }

  /* ── MAIN CONTAINER ── */
  .container {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* ── TOP BADGE (like image 2) ── */
  .top-badge {
    display: flex; align-items: center; gap: 18px;
    background: linear-gradient(135deg,
      rgba(15,22,10,0.92) 0%,
      rgba(30,48,18,0.88) 50%,
      rgba(15,22,10,0.92) 100%
    );
    border: 1.5px solid var(--gold);
    border-radius: 14px;
    padding: 14px 28px;
    box-shadow:
      0 0 0 1px rgba(200,168,75,0.15),
      0 0 30px rgba(200,168,75,0.2),
      inset 0 1px 0 rgba(200,168,75,0.15);
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease forwards;
    max-width: 620px; width: 100%;
  }

  /* ── LOGO EMBLEM ── */
  .emblem-wrap {
    flex-shrink: 0;
    width: 72px; height: 72px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow:
      0 0 16px rgba(200,168,75,0.4),
      0 0 4px rgba(200,168,75,0.6) inset;
    background: #1a0e05;
  }
  .emblem-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .badge-text { flex: 1; }
  .badge-text .t1 {
    font-family: 'Sarabun', sans-serif;
    font-weight: 700; font-size: 17px;
    color: var(--gold-light);
    line-height: 1.3;
    text-shadow: 0 0 20px rgba(200,168,75,0.5);
  }
  .badge-text .t2 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 400; font-size: 12px;
    color: rgba(200,168,75,0.7);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ── CARD ── */
  .card {
    background: linear-gradient(160deg,
      rgba(12,18,8,0.90) 0%,
      rgba(22,36,14,0.85) 100%
    );
    border: 1px solid rgba(200,168,75,0.35);
    border-radius: 18px;
    padding: 38px 42px 34px;
    width: 100%; max-width: 480px;
    box-shadow:
      0 0 0 1px rgba(200,168,75,0.08),
      0 20px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(200,168,75,0.08);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s ease 0.15s both;
  }

  /* corner decorations */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
    border-style: solid;
  }
  .card::before {
    top: 10px; left: 10px;
    border-width: 2px 0 0 2px;
  }
  .card::after {
    bottom: 10px; right: 10px;
    border-width: 0 2px 2px 0;
  }

  .card-title {
    text-align: center;
    font-weight: 800; font-size: 24px;
    color: var(--cream);
    margin-bottom: 28px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
  }

  /* ── SELECTOR LABEL ── */
  .sel-label {
    font-size: 13px;
    color: rgba(200,168,75,0.8);
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* ── DROPDOWN ── */
  .select-wrap {
    position: relative; margin-bottom: 22px;
  }
  .select-wrap::before {
    content: '🪖';
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    z-index: 2; font-size: 18px;
    pointer-events: none;
  }
  .sel {
    width: 100%;
    appearance: none;
    background: linear-gradient(135deg,
      rgba(20,32,12,0.95) 0%,
      rgba(35,55,20,0.9) 100%
    );
    border: 1.5px solid var(--gold);
    border-radius: 50px;
    padding: 14px 48px 14px 52px;
    font-family: 'Sarabun', sans-serif;
    font-size: 16px; font-weight: 600;
    color: var(--cream);
    cursor: pointer;
    box-shadow:
      0 0 12px rgba(200,168,75,0.15),
      inset 0 1px 0 rgba(200,168,75,0.1);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .sel:focus {
    border-color: var(--gold-light);
    box-shadow: 0 0 20px rgba(200,168,75,0.35);
  }
  .sel option {
    background: #1a2a12;
    color: var(--cream);
    padding: 10px;
  }
  .sel option:disabled {
    color: rgba(200,168,75,0.5);
  }

  /* chevron */
  .chevron {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    pointer-events: none;
    color: var(--gold);
  }
  .chevron svg { width:100%; height:100%; fill:currentColor; }

  /* ── BUTTON ── */
  .btn-go {
    width: 100%;
    padding: 16px;
    border: none; border-radius: 50px;
    font-family: 'Sarabun', sans-serif;
    font-size: 20px; font-weight: 800;
    color: var(--black);
    cursor: pointer;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg,
      #7ab648 0%, #5a9a28 35%, #6db340 65%, #4a8a18 100%
    );
    box-shadow:
      0 4px 20px rgba(90,154,40,0.45),
      0 0 0 1px rgba(122,182,72,0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  .btn-go::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
  }
  .btn-go:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 30px rgba(90,154,40,0.55),
      0 0 0 2px rgba(122,182,72,0.5),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-go:active { transform: translateY(0); }
  .btn-go:disabled {
    opacity: 0.5; cursor: not-allowed;
    transform: none;
  }

  /* pulse ring on button */
  .btn-go::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 50px;
    border: 2px solid rgba(122,182,72,0.4);
    animation: pulse-ring 2s ease-in-out infinite;
  }
  @keyframes pulse-ring {
    0%, 100% { opacity: 0; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.01); }
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,168,75,0.3), transparent);
  }
  .divider-star {
    color: var(--gold); font-size: 12px;
    opacity: 0.6;
  }

  /* ── ERROR MSG ── */
  .err-msg {
    display: none;
    text-align: center;
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 10px;
    animation: shake 0.3s ease;
  }
  .err-msg.show { display: block; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 32px;
    display: flex; gap: 24px;
    justify-content: center;
    animation: fadeUp 0.7s ease 0.35s both;
  }
  .footer a {
    color: rgba(200,168,75,0.55);
    font-size: 12px; text-decoration: none;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 0.5px;
    transition: color 0.2s;
  }
  .footer a:hover { color: var(--gold-light); }

  .copy {
    text-align: center; margin-top: 8px;
    color: rgba(200,168,75,0.3);
    font-size: 11px;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
    animation: fadeUp 0.7s ease 0.4s both;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ── YEAR TAGS ── */
  .year-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-family: 'Chakra Petch', sans-serif;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-3 { background: rgba(200,168,75,0.2); color: var(--gold); border: 1px solid rgba(200,168,75,0.4); }
  .tag-2 { background: rgba(74,133,200,0.2); color: #6bb5f0; border: 1px solid rgba(74,133,200,0.4); }
  .tag-1 { background: rgba(200,74,74,0.2); color: #f09090; border: 1px solid rgba(200,74,74,0.4); }

  /* ── STAR SPARKLE (bottom-right corner) ── */
  .sparkle {
    position: fixed; bottom: 24px; right: 24px; z-index: 20;
    width: 36px; height: 36px;
    opacity: 0.7;
    animation: spin-slow 8s linear infinite;
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── PARTICLES (optional ambient dots) ── */
  .particle {
    position: fixed; border-radius: 50%;
    background: rgba(200,168,75,0.6);
    pointer-events: none; z-index: 5;
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0%   { opacity:0; transform: translateY(0) scale(0.5); }
    10%  { opacity:0.7; }
    90%  { opacity:0.3; }
    100% { opacity:0; transform: translateY(-100vh) scale(1); }
  }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    .card { padding: 28px 22px 24px; }
    .top-badge { padding: 12px 18px; gap: 12px; margin-bottom: 32px; }
    .badge-text .t1 { font-size: 14px; }
    .emblem-wrap { width: 56px; height: 56px; }
    .card-title { font-size: 20px; }
  }
</style>
</head>

    <div class="card-title">เลือกชั้นปีของคุณ</div>

    <div class="sel-label">ชั้นปี / YEAR</div>
    <div class="select-wrap">
      <select class="sel" id="yearSel">
        <option value="" disabled selected>🪖โปรดเลือกชั้นปี...</option>
        <option value="1">ชั้นปีที่ 1 — ร้อยสาม</option>
        <option value="2">ชั้นปีที่ 2 — ร้อยสอง</option>
        <option value="3">ชั้นปีที่ 3 — ร้อยหนึ่ง</option>
      </select>
      <div class="chevron">
        <svg viewBox="0 0 20 20"><path d="M5 7l5 5 5-5z"/></svg>
      </div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-star">★</div>
      <div class="divider-line"></div>
    </div>

    <button class="btn-go" id="goBtn" onclick="goStatus()">ดูสถานะ</button>
    <div class="err-msg" id="errMsg">⚠️ กรุณาเลือกชั้นปีก่อน</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#">ติดต่อเรา</a>
    <a href="#">นโยบายความเป็นส่วนตัว</a>
  </div>
  <div class="copy">© 2026 ระบบสารสนเทศทหารไทย</div>

</div>

<script>
  // ── Embed logo as fallback if logo.jpg doesn't exist ──
  // (will show broken img gracefully)
  
  // ── Year selection logic ──
  const yearSel = document.getElementById('yearSel');
  const errMsg  = document.getElementById('errMsg');

  // Map: year value → หน้าข้อมูลสถานะ นศท.
  const YEAR_MAP = {
    '1': '103.html',  // ร้อยสาม — ชั้นปีที่ 1
    '2': '102.html',  // ร้อยสอง — ชั้นปีที่ 2
    '3': '101.html',  // ร้อยหนึ่ง — ชั้นปีที่ 3
  };

  yearSel.addEventListener('change', () => {
    errMsg.classList.remove('show');
  });

  function goStatus() {
    const val = yearSel.value;
    if (!val) {
      errMsg.classList.add('show');
      errMsg.style.animation = 'none';
      requestAnimationFrame(() => {
        errMsg.style.animation = '';
      });
      return;
    }
    // Store selected year in sessionStorage so main page can read it
    sessionStorage.setItem('selectedYear', val);
    // Navigate to main system
    window.location.href = YEAR_MAP[val];
  }

  // ── Allow Enter key ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') goStatus();
  });

  // ── Ambient particles ──
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}vw;
      bottom:-10px;
      animation-duration:${8 + Math.random()*12}s;
      animation-delay:${Math.random()*5}s;
      opacity:0;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 20000);
  }
  setInterval(spawnParticle, 2000);
  for (let i = 0; i < 5; i++) spawnParticle();
</script>

</body>
</html>
